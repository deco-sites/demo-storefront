name: preview-url
on:
  check_run:
    types: [completed]

jobs:
  comment:
    # Cloudflare's own PR comment omits the Preview URL column for this Worker,
    # but its check run carries the Version ID, and the preview hostname is
    # derived from it. Post the link ourselves.
    if: startsWith(github.event.check_run.name, 'Workers Builds:')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const cr = context.payload.check_run;
            const pr = cr.pull_requests?.[0];
            const id = /Version ID: ([0-9a-f]{8})/.exec(cr.output?.summary ?? "")?.[1];
            if (!pr || !id) return;
            // ponytail: worker name hardcoded; parameterize when a second site needs it.
            const body = `<!-- preview-url -->\n🔗 **Preview:** https://${id}-demo-storefront.deco-cx.workers.dev`;
            const { data } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr.number });
            const prev = data.find((c) => c.body.includes("<!-- preview-url -->"));
            await (prev
              ? github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body })
              : github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body }));
